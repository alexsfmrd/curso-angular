<article class="tarjeta"
[class.destacada]="actividad().destacada"
[class.seleccionada]="seleccionada()">

  <h4>{{ actividad().titulo }}</h4>
  <p class="prioridad prioridad-{{ actividad().prioridad }}">
    Prioridad {{ actividad().prioridad }}
  </p>
  <p class="estado" [class]="'estado ' + 'estado-' + actividad().estado">{{ etiquetaEstado() }}</p>
  <div class="barra-progreso" role="progressbar" aria-label="Progreso de la actividad destacada" aria-valuemin="0"
    aria-valuemax="100" [attr.aria-valuenow]="porcentaje">
    <span [style.width.%]="porcentaje"></span>
  </div>
    <p class="porcentaje">{{ porcentaje }}% completado</p>
  <div class="acciones">
    <button type="button" [attr.aria-pressed]="seleccionada()" (click)="seleccionCambiada.emit(actividad().id)">
      {{ seleccionada() ? 'Quitar selección' : 'Seleccionar' }}
    </button>
    <button type="button" (click)="destacadoCambiado.emit(actividad().id)">
      {{ actividad().destacada ? 'Quitar destacado' : 'Destacar' }}
    </button>
    <button type="button" [disabled]="actividad().estado === 'completada'"
      (click)="avanceSolicitado.emit(actividad().id)">
      Avanzar estado
    </button>
    <button type="button" [attr.aria-label]="etiquetaEliminar()" (click)="eliminacionSolicitada.emit(actividad().id)">
      Eliminar
    </button>
  </div>
</article>
